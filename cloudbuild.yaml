substitutions:
  _REGION: asia-northeast3
  _VERTEX_AI_LOCATION: global
  _ARTIFACT_REPOSITORY: invoicex
  _SERVICE: invoicex-api
  _SERVICE_ACCOUNT: invoicex-api@${PROJECT_ID}.iam.gserviceaccount.com
  _CLOUD_SQL_INSTANCE: ${PROJECT_ID}:asia-northeast3:invoicex
  _CLOUD_SQL_DATABASE: invoicex
  _CLOUD_SQL_USER: invoicex_app
  _DOCUMENT_BUCKET: ${PROJECT_ID}-invoicex-documents
  _IMAGE_TAG: manual
  _AGENT_TASK_QUEUE: invoicex-agent-runs
  _FRONTEND_ORIGIN: https://invoicex-web-ew3oji7ara-du.a.run.app
  _PRIVY_TREASURY_WALLET_ADDRESS: BDRW9KjvbJA5pxavitWJQ6o3HQiHjmtiZKw5mnJbjXYY
  _PRIVY_SPONSOR_WALLET_ADDRESS: Cx5wfw5kmNRwLTVAB3TdagrU1QAF6QR7wPAq8bDdNL5T
  _PRIVY_JWKS_URL: https://auth.privy.io/api/v1/apps/cms678zqw007k0cjkq4jhxn9q/jwks.json
  _CLOUD_RUN_TASK_AUDIENCE: https://invoicex-api-ew3oji7ara-du.a.run.app

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file=backend/Dockerfile
      - --tag=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPOSITORY}/${_SERVICE}:${_IMAGE_TAG}
      - .
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPOSITORY}/${_SERVICE}:${_IMAGE_TAG}
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPOSITORY}/${_SERVICE}:${_IMAGE_TAG}
      - --region=${_REGION}
      - --service-account=${_SERVICE_ACCOUNT}
      - --add-cloudsql-instances=${_CLOUD_SQL_INSTANCE}
      - --allow-unauthenticated
      - --min-instances=0
      - --max-instances=1
      - --concurrency=1
      - --set-env-vars=DEPLOYMENT_TARGET=gcp,PERSISTENCE_BACKEND=cloud_sql,DOCUMENT_STORAGE_BACKEND=gcs,API_AUTH_REQUIRED=true,SECRET_MANAGER_ENABLED=false,GCP_PROJECT_ID=${PROJECT_ID},VERTEX_AI_PROJECT_ID=${PROJECT_ID},VERTEX_AI_LOCATION=${_VERTEX_AI_LOCATION},CLOUD_SQL_INSTANCE_CONNECTION_NAME=${_CLOUD_SQL_INSTANCE},CLOUD_SQL_DATABASE=${_CLOUD_SQL_DATABASE},CLOUD_SQL_USER=${_CLOUD_SQL_USER},CLOUD_SQL_IP_TYPE=public,GCS_DOCUMENT_BUCKET=${_DOCUMENT_BUCKET},GCS_DOCUMENT_PREFIX=invoices,GCS_SIGNED_URL_TTL_SECONDS=900,GCS_SIGNING_SERVICE_ACCOUNT=${_SERVICE_ACCOUNT},FRONTEND_ORIGIN=${_FRONTEND_ORIGIN},PRIVY_JWKS_URL=${_PRIVY_JWKS_URL},PRIVY_TREASURY_WALLET_ADDRESS=${_PRIVY_TREASURY_WALLET_ADDRESS},GASLESS_ENABLED=true,PRIVY_SPONSOR_WALLET_ADDRESS=${_PRIVY_SPONSOR_WALLET_ADDRESS},PRIVY_BROADCAST_MODE=rpc,MOCK_SETTLEMENT_ENABLED=false,AGENT_MODE=real,AGENT_TASK_DISPATCHER=cloud_tasks,CLOUD_TASKS_QUEUE=${_AGENT_TASK_QUEUE},CLOUD_TASKS_LOCATION=${_REGION},CLOUD_RUN_TASK_AUDIENCE=${_CLOUD_RUN_TASK_AUDIENCE},CLOUD_TASKS_SERVICE_ACCOUNT_EMAIL=${_SERVICE_ACCOUNT},SOLANA_MODE=privy,SOLANA_CLUSTER=devnet
      - --set-secrets=CLOUD_SQL_PASSWORD=cloud-sql-password:latest,AUTH_TOKEN_SECRET=auth-token-secret:latest,PRIVY_APP_ID=privy-app-id:latest,PRIVY_APP_SECRET=privy-app-secret:latest,PRIVY_WALLET_ID=privy-wallet-id:latest,PRIVY_RWA_ISSUER_WALLET_ID=privy-rwa-issuer-wallet-id:latest,PRIVY_SPONSOR_WALLET_ID=privy-sponsor-wallet-id:latest,SOLANA_RPC_URL=solana-rpc-url:latest

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPOSITORY}/${_SERVICE}:${_IMAGE_TAG}

options:
  dynamic_substitutions: true
