substitutions:
  _REGION: asia-northeast3
  _ARTIFACT_REPOSITORY: invoicex
  _SERVICE: invoicex-api
  _SERVICE_ACCOUNT: invoicex-api@${PROJECT_ID}.iam.gserviceaccount.com
  _CLOUD_SQL_INSTANCE: ${PROJECT_ID}:asia-northeast3:invoicex
  _CLOUD_SQL_DATABASE: invoicex
  _CLOUD_SQL_USER: invoicex_app
  _DOCUMENT_BUCKET: ${PROJECT_ID}-invoicex-documents
  _IMAGE_TAG: manual

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file=backend/Dockerfile
      - --tag=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPOSITORY}/${_SERVICE}:${_IMAGE_TAG}
      - .
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPOSITORY}/${_SERVICE}:${_IMAGE_TAG}
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPOSITORY}/${_SERVICE}:${_IMAGE_TAG}
      - --region=${_REGION}
      - --service-account=${_SERVICE_ACCOUNT}
      - --add-cloudsql-instances=${_CLOUD_SQL_INSTANCE}
      - --allow-unauthenticated
      - --min-instances=0
      - --max-instances=1
      - --concurrency=1
      - --set-env-vars=DEPLOYMENT_TARGET=gcp,PERSISTENCE_BACKEND=cloud_sql,DOCUMENT_STORAGE_BACKEND=gcs,API_AUTH_REQUIRED=true,SECRET_MANAGER_ENABLED=true,GCP_PROJECT_ID=${PROJECT_ID},CLOUD_SQL_INSTANCE_CONNECTION_NAME=${_CLOUD_SQL_INSTANCE},CLOUD_SQL_DATABASE=${_CLOUD_SQL_DATABASE},CLOUD_SQL_USER=${_CLOUD_SQL_USER},CLOUD_SQL_IP_TYPE=public,GCS_DOCUMENT_BUCKET=${_DOCUMENT_BUCKET},GCS_DOCUMENT_PREFIX=invoices,GCS_SIGNED_URL_TTL_SECONDS=900,GCS_SIGNING_SERVICE_ACCOUNT=${_SERVICE_ACCOUNT},FRONTEND_ORIGIN=${_FRONTEND_ORIGIN},PRIVY_TREASURY_WALLET_ADDRESS=${_PRIVY_TREASURY_WALLET_ADDRESS},GASLESS_ENABLED=true,PRIVY_SPONSOR_WALLET_ADDRESS=${_PRIVY_SPONSOR_WALLET_ADDRESS},PRIVY_BROADCAST_MODE=rpc,MOCK_SETTLEMENT_ENABLED=false,AGENT_MODE=real,SOLANA_MODE=privy,SOLANA_CLUSTER=devnet
      - --set-secrets=CLOUD_SQL_PASSWORD=cloud-sql-password:latest,AUTH_TOKEN_SECRET=auth-token-secret:latest,GEMINI_API_KEY=gemini-api-key:latest,PRIVY_APP_ID=privy-app-id:latest,PRIVY_APP_SECRET=privy-app-secret:latest,PRIVY_WALLET_ID=privy-wallet-id:latest,PRIVY_RWA_ISSUER_WALLET_ID=privy-rwa-issuer-wallet-id:latest,PRIVY_SPONSOR_WALLET_ID=privy-sponsor-wallet-id:latest,SOLANA_RPC_URL=solana-rpc-url:latest

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPOSITORY}/${_SERVICE}:${_IMAGE_TAG}

options:
  dynamic_substitutions: true
