[project]
name = "invoicex-backend"
version = "0.1.0"
description = "FastAPI backend implementing the InvoiceX frontend API contract"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "google-cloud-secret-manager>=2.20,<3",
  "httpx>=0.28,<1",
  "invoicex-agents",
  "pydantic-settings>=2.7,<3",
  "PyJWT[crypto]>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "solana>=0.36,<1",
  "solders>=0.23,<0.27",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<2",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]

[tool.uv.sources]
invoicex-agents = { path = "../agent", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/invoicex_backend"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
